  <!-- O CUBO escondido na teia: hexágono externo + as 3 arestas visíveis do cubo em perspectiva -->
  <g stroke="#9fd8ff" stroke-width="1.6" fill="none" filter="url(#brilho)" opacity="0.95">
    <polygon points="300,108 466.28,204 466.28,396 300,492 133.72,396 133.72,204"/>
    <line x1="300" y1="108" x2="300" y2="300"/>
    <line x1="466.28" y1="396" x2="300" y2="300"/>
    <line x1="133.72" y1="396" x2="300" y2="300"/>
    <polygon points="300,300 466.28,204 300,492" opacity="0"/>
  </g>
  <g stroke="#9fd8ff" stroke-width="1.1" fill="none" opacity="0.8" filter="url(#brilho)">
    <line x1="300" y1="492" x2="300" y2="300"/>
    <line x1="466.28" y1="204" x2="300" y2="300"/>
    <line x1="133.72" y1="204" x2="300" y2="300"/>
  </g>

  <!-- Os 13 círculos da Fruta da Vida -->
  <g stroke="#e8f4ff" stroke-width="1.3" fill="none" filter="url(#brilho)">
    <circle cx="300" cy="300" r="48"/>
    <circle cx="300" cy="204" r="48"/><circle cx="383.14" cy="252" r="48"/><circle cx="383.14" cy="348" r="48"/><circle cx="300" cy="396" r="48"/><circle cx="216.86" cy="348" r="48"/><circle cx="216.86" cy="252" r="48"/>
    <circle cx="300" cy="108" r="48"/><circle cx="466.28" cy="204" r="48"/><circle cx="466.28" cy="396" r="48"/><circle cx="300" cy="492" r="48"/><circle cx="133.72" cy="396" r="48"/><circle cx="133.72" cy="204" r="48"/>
  </g>

  <!-- Os 13 centros: pontos de luz -->
  <g fill="#e8f4ff" filter="url(#brilho)">
    <circle cx="300" cy="300" r="3"/>
    <circle cx="300" cy="204" r="2.2"/><circle cx="383.14" cy="252" r="2.2"/><circle cx="383.14" cy="348" r="2.2"/><circle cx="300" cy="396" r="2.2"/><circle cx="216.86" cy="348" r="2.2"/><circle cx="216.86" cy="252" r="2.2"/>
    <circle cx="300" cy="108" r="2.2"/><circle cx="466.28" cy="204" r="2.2"/><circle cx="466.28" cy="396" r="2.2"/><circle cx="300" cy="492" r="2.2"/><circle cx="133.72" cy="396" r="2.2"/><circle cx="133.72" cy="204" r="2.2"/>
